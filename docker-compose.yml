services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eboost
      POSTGRES_USER: eboost
      POSTGRES_PASSWORD: eboost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eboost -d eboost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file:
      - .env
    command: sh -c "alembic upgrade head && uvicorn eboost.backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file:
      - .env
    command: python -m eboost.bot.main
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
